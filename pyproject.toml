[project]
name = "prudence-dev"
version = "0.4.0"
description = "Turns AI-assisted development into a feedback loop: records agent sessions, follows the code through git, distils what worked into the next round"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Prudence contributors" },
]
dependencies = [
    "click>=8.1",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2,<2"]
model = ["anthropic>=0.40"]

[project.scripts]
prudence = "prudence.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prudence"]

[dependency-groups]
dev = [
    "anthropic>=0.40",
    "mcp>=1.2,<2",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# `Scripts/strings.py` carries a table of user-facing sentences in two languages. A line
# limit is a rule about code, and wrapping a translation across lines to satisfy it makes
# the string harder to read and harder to compare with its pair. Everything else in the
# file is still held to 100.
"apps/desktop/Scripts/strings.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
