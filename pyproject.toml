[project]
name = "prudence-dev"
version = "0.3.0"
description = "A growth coach for developers who build with AI coding agents: links agent sessions to what became of the code in git"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Prudence contributors" },
]
dependencies = [
    "click>=8.1",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2,<2"]
model = ["anthropic>=0.40"]

[project.scripts]
prudence = "prudence.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prudence"]

[dependency-groups]
dev = [
    "anthropic>=0.40",
    "mcp>=1.2,<2",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
