name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: One version number everywhere
        run: python3 scripts/version.py --check

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Python
        run: uv python install 3.12

      - name: Build sdist and wheel
        run: uv build

      - name: Check wheel contents
        run: |
          wheel=$(ls dist/*.whl)
          listing=$(python3 -m zipfile -l "$wheel")
          echo "$listing"
          if ! echo "$listing" | grep -q "prudence/hooks/prudence-hook.sh"; then
            echo "Missing prudence/hooks/prudence-hook.sh in the wheel"
            exit 1
          fi
          if echo "$listing" | grep -Eq "^\s*(tests/|prudence/tests/)"; then
            echo "Wheel must not contain a tests directory"
            exit 1
          fi
          if echo "$listing" | grep -q "^plugin/"; then
            echo "Wheel must not contain the plugin/ directory"
            exit 1
          fi
          if echo "$listing" | grep -q "^docs/"; then
            echo "Wheel must not contain docs/"
            exit 1
          fi

  leak-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for harness files that must not be public
        run: |
          leaked=0
          for path in CLAUDE.md AGENTS.md .claude .codex memory conventions docs ROADMAP.md CHANGELOG.md changelog; do
            if [ -e "$path" ]; then
              echo "Leaked harness path found: $path"
              leaked=1
            fi
          done
          if [ "$leaked" -ne 0 ]; then
            exit 1
          fi
