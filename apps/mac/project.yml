# The Xcode project is generated from this file and is not tracked.
#
# An agent edits ordered YAML it can read, never a `project.pbxproj`, and the generated
# project cannot conflict in a merge because it is not in git. `Scripts/bootstrap.sh`
# installs XcodeGen if it is missing and runs `xcodegen generate`.
#
# The app target holds SwiftUI views and AppKit glue only. Everything it thinks with lives in
# the local `PrudenceKit` package, which `swift test` checks in seconds with no project at all.

name: Prudence

options:
  bundleIdPrefix: dev.prudence
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  PrudenceKit:
    path: PrudenceKit

settings:
  base:
    # Universal, and explicitly so: Xcode 27 drops x86_64 from ARCHS_STANDARD only for a
    # deployment target of 27.0 or later, but saying it here means a later bump of the floor
    # cannot silently turn the app Apple-silicon-only.
    ARCHS: $(ARCHS_STANDARD)
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    # Developer ID, no sandbox, empty entitlements: a sandboxed app can neither read the
    # engine's database nor execute the engine (research note, section 6).
    ENABLE_APP_SANDBOX: NO
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES
  configs:
    # Debug builds only this machine's architecture, which is Xcode's own default and what
    # keeps the local loop fast; the SwiftPM package targets follow the same rule, and a
    # Debug build that asked for both would look for an x86_64 slice of the package that
    # nothing built. The shipping build is Release, and Release is universal.
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      ONLY_ACTIVE_ARCH: NO

targets:
  Prudence:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: PrudenceKit
        product: PrudenceStore
      - package: PrudenceKit
        product: PrudenceEngine
      - package: PrudenceKit
        product: PrudenceModels
    settings:
      base:
        # Placeholder. The real identifier is decided with the Apple Developer Program
        # account (M3 plan, open question 4); changing it later is a one-line edit here plus
        # a new provisioning profile, and nothing in the code reads it.
        PRODUCT_BUNDLE_IDENTIFIER: dev.prudence.app
        PRODUCT_NAME: Prudence
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Prudence.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

schemes:
  Prudence:
    build:
      targets:
        Prudence: all
    run:
      config: Debug
    archive:
      config: Release
